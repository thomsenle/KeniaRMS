<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="100%" stop-color="#141824" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle glow ring -->
  <rect x="56" y="56" width="400" height="400" rx="92" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="4" />

  <!-- Amber Gold Badge -->
  <rect x="76" y="76" width="360" height="360" rx="80" fill="url(#amberGrad)" filter="url(#glow)" />

  <!-- Inner subtle border -->
  <rect x="88" y="88" width="336" height="336" rx="68" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" />

  <!-- Center 'K' Graphic -->
  <g fill="#0d1117">
    <!-- Vertical Bar -->
    <rect x="156" y="146" width="46" height="220" rx="14" />
    <!-- Diagonal Up -->
    <path d="M 188 266 L 296 156 C 304 148 318 152 322 162 L 324 168 C 328 178 324 188 316 196 L 226 280 Z" />
    <!-- Diagonal Down -->
    <path d="M 216 266 L 316 354 C 324 362 328 372 322 382 L 318 388 C 314 398 300 402 292 394 L 188 296 Z" />
    <!-- Small Waiter Service Dot/Ring Accent -->
    <circle cx="340" cy="180" r="14" fill="#0d1117" />
  </g>

  <!-- Badge Subtitle -->
  <rect x="176" y="406" width="160" height="34" rx="17" fill="rgba(10, 12, 16, 0.85)" />
  <text x="256" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="2">WAITER POS</text>
</svg>
